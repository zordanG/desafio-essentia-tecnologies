<mat-toolbar class="app-toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="/" aria-label="TechX Tasks home">
      <span class="brand-icon" aria-hidden="true">
        <mat-icon>task_alt</mat-icon>
      </span>
      <span class="brand-name">TechX Tasks</span>
    </a>

    <button
      mat-icon-button
      type="button"
      class="theme-toggle"
      [attr.aria-label]="themeService.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
      [attr.aria-pressed]="themeService.isDark()"
      (click)="themeService.toggle()"
    >
      <mat-icon aria-hidden="true">{{
        themeService.isDark() ? 'light_mode' : 'dark_mode'
      }}</mat-icon>
    </button>

    @if (authService.isAuthenticated()) {
      <div class="user-menu">
        <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Menu do usuário">
          <mat-icon>account_circle</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu">
          <span class="user-email">{{ authService.user()?.email }}</span>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Sair</span>
          </button>
        </mat-menu>
      </div>
    }
  </div>
</mat-toolbar>

<main class="shell">
  <router-outlet />
</main>

<mat-menu #userMenu="matMenu">
  <button mat-menu-item (click)="logout()">
    <mat-icon>logout</mat-icon>
    <span>Sair</span>
  </button>
</mat-menu>
