<h2 mat-dialog-title id="todo-confirm-title">{{ data.title }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button type="button" color="warn" (click)="confirm()">
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
